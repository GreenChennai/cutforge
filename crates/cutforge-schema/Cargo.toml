[package]
name = "cutforge-schema"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "CutForge 契约层:五份 JSON Schema 的加载、代码生成与迁移(契约层是叶子,不得依赖其他 cutforge crate)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ADR-0034:schema pattern 断言所需;契约层最小依赖集 = serde + serde_json + regex
regex = "1"

[package.metadata.arl]
core = true
