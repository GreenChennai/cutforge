[workspace]
resolver = "3"
members = [
    "crates/cutforge-core",
    "crates/cutforge-io",
    "crates/cutforge-cli",
    "crates/cutforge-schema",
    # 'crates/*' 其余成员随 M2+ 逐里程碑加入
    # 'apps/desktop',     ← M5 加入(与上游一致,当前尚不存在)
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"      # ARL-1.0;MIT 归属走 NOTICE.md + LICENSE-OPENCUT.MIT

[profile.release]
lto = "thin"
strip = "debuginfo"
