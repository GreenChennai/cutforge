name: gate
on: [push, pull_request]

jobs:
  python-gates:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      # 跨仓检查(repo-size / tests-layout)依赖 CutFlow 仓库
      CUTFLOW_REPO: ${{ github.workspace }}/../CutFlow
    steps:
      - uses: actions/checkout@v4
      - name: Clone CutFlow (shallow) for cross-repo checks
        run: |
          git clone --depth 50 https://github.com/GreenChennai/CutFlow.git ../CutFlow
          # 跨仓门禁快照钉扎:CutFlow v0.21.0(e1745c1)将 docs/adr/0060 先行落地、其 README
          # 的 ADR 索引未同步,M1 doc-consistency(README 索引须含最新编号)被跨仓连带红。
          # 钉到已验证截面 faad005;CutFlow README 索引补齐 0060 后删除 checkout 行即回到 main。
          git -C ../CutFlow checkout faad005
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # A1 册级门禁(D-A2 注册制)不整挂进 CI:全量 cargo test + tool_parity + e2e + bench
      # 阈值由本机册收官统一执行 —— python tools/gates/gate.py A1(§1.4);
      # clippy 已单独挂 clippy-gates job(G-3,见下)。
      - name: Milestone gates (CI-runnable subset; M2-M6 本地阻断,见 docs/FLOW.md)
        run: |
          python tools/gates/gate.py M0 --json
          python tools/gates/gate.py M1 --json
      - name: Python tests (cutflow-side bridge scripts live in CutFlow repo)
        if: hashFiles('tests/**/*.py') != ''
        run: |
          pip install pytest -q
          python -m pytest tests -q

  rust-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ffmpeg + gpui Linux 系统库(apps/desktop 进 workspace 后的编译依赖,同 sable CI)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libgbm-dev libfontconfig-dev libxcb1-dev libx11-dev libudev-dev libasound2-dev pkg-config
      - name: Build & test (auto-enables when crates land)
        if: hashFiles('crates/*/Cargo.toml') != ''
        env:
          # M8-2 夹具再生成校验(真实 IR 来自 CutFlow rs_ir.py)
          CUTFLOW_REPO: ${{ github.workspace }}/../CutFlow
        run: |
          git clone --depth 1 https://github.com/GreenChennai/CutFlow.git ../CutFlow
          python3 tools/gen_real_ir_fixture.py --check
          cargo build --workspace --locked
          cargo test --workspace --locked
      # AC-1.2:MCP 41 工具黄金响应库对拍(golden 在库 tools/bench/golden/;
      # 行为有计划变更时本地 --update-golden 重建后随 MR 提交)
      - name: MCP tool parity golden check (AC-1.2)
        if: hashFiles('tools/bench/tool_parity.py') != ''
        run: python3 tools/bench/tool_parity.py --json

  # G-3(审查报告 v2 §8.1): clippy -D warnings 进 CI(此前只在本地册收官人工跑,会漏)。
  # 预期注记(V2-W1-GATES 挂载时点):本地预跑因并行动工波次(cutforge-mcp io/安全在制品
  # 的 3 处 lint:progress.rs let_unit_value / resident.rs type_complexity / doc list)暂红,
  # 基线归因见工单报告;波次集成后由主会话统一验证转绿,本 job 即恢复把关效力。
  # 注:A1 行数红线(rust-line-limit)与 bench 阈值本轮仍不挂 CI——crates/ 现存多个 >800 行
  # 文件(A-01/A-02/A-05 拆分波进行中,详见 docs/A8-ITERATION-SUMMARY.md 订正段),挂了永红。
  # 启用条件:① rust-line-limit——上述拆分波落地、`gate.py A1 --check rust-line-limit` 转绿后,
  # 以 `python tools/gates/gate.py A1 --check rust-line-limit --json` 形态挂回;
  # ② bench 阈值——bench 基线在共享 runner 可复现(安静时段双跑抖动 <5%)后挂回。
  clippy-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install ffmpeg + gpui Linux 系统库(--all-targets 会编译 apps/desktop,同 rust-gates)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libgbm-dev libfontconfig-dev libxcb1-dev libx11-dev libudev-dev libasound2-dev pkg-config
      - name: cargo clippy --workspace --all-targets -D warnings (A1-2/G-3)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # G-6(审查报告 v2 §8.1): check-write-paths(命令通道唯一性,项目立身之本)进 CI,
  # 随 M2 全册一次跑齐(覆盖率/往返/撤销/wasm/依赖方向)。
  # 预期注记(V2-W1-GATES 挂载时点):本地预跑 M2 为红(退出码 2),归因两处、均不在本工单改动面——
  # ① 基线存量:media_library.rs:369 生产代码 std::fs::write 旁路(册六 media_import 落库时
  #    写路径纪律不在 CI 而漏检,G-6 预言的失效模式实证)+ mcp→render 违规依赖边
  #    (HEAD crates/cutforge-mcp/Cargo.toml:14 既有);② 并行波次在制品:scratch.rs 新增 2 处
  #    (IO 耐久工单 copy_tree 改造中)。本 job 挂载即为把这两类违规显式化;波次集成、
  #    上述违规收口后由主会话统一验证转绿。
  # G-4 check_changelog(警告级)随本 job 生效:PR 传 base sha 做真 diff,push 无基准自然跳过;
  # 升级红线条件见 CONTRIBUTING.md「门禁扫描面登记」。
  kernel-gates:
    runs-on: ubuntu-latest
    env:
      CUTFORGE_CHANGELOG_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # G-4 需要 PR base 提交对象可 diff
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown   # M2-5 wasm-core 构建
      - name: Install cargo-llvm-cov(M2-1 覆盖率门禁依赖)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Milestone gates M2(write-paths G-6 + 覆盖率/往返/撤销/wasm/依赖方向 + changelog G-4)
        run: python tools/gates/gate.py M2 --json

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ffmpeg(E2 预览 e2e 需现场生成媒体夹具)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Build (M10-1/M10-2/E2 e2e 需要服务端二进制;E5 导出 e2e 需渲染器与 cli)
        run: cargo build -p cutforge-mcp -p cutforge-render -p cutforge-cli --locked
      - name: Install playwright (chromium)
        run: |
          pip install playwright -q
          python -m playwright install --with-deps chromium
      - name: M10-1/M10-2/M10-3 e2e
        run: python tools/e2e_edit_ops.py --bin target/debug/cutforge-mcp
      - name: E2 预览 e2e(画面/声音/seek 对齐/像素非黑/壳纯度)
        run: python tools/e2e_preview.py --bin target/debug/cutforge-mcp
      - name: 从零剪 e2e(新建工程→导入→改字段→导出;渲染期间并发不阻塞;RT-1 摘要)
        run: python tools/e2e_from_zero.py --bin target/debug/cutforge-mcp --cli target/debug/cutforge-cli
      - name: T1.6/AC-1.6 静态目录托管 e2e(穿越拒绝 + ETag/304;纯 stdlib,无 Windows 专属假设)
        run: python tools/e2e_static.py --bin target/debug/cutforge-mcp
      - name: T1.6/AC-1.5 事件推送 e2e(SSE P95 + 长轮询降级;纯 stdlib)
        run: python tools/e2e_events.py --bin target/debug/cutforge-mcp
      - name: A2 UI 冒烟 e2e(data-testid 驱动;断言以服务端状态 rev/盘面为准)
        run: python tools/e2e_ui_smoke.py --bin target/debug/cutforge-mcp
      - name: A2 播放存活 e2e(播放中改工程不销毁媒体元素/事件不丢/媒体池增量)
        run: python tools/e2e_playback_survival.py --bin target/debug/cutforge-mcp
      - name: A3 键位体系 e2e(注册表 ≥40 条遍历/抽样实按 ≥15/重绑定冲突检测闭环/输入态屏蔽)
        run: python tools/e2e_hotkeys.py --bin target/debug/cutforge-mcp
      - name: A3 可访问性 e2e(键盘编辑闭环 rev/OpLog 断言;axe-core 4 全页扫描 0 新增 critical/serious)
        run: python tools/e2e_a11y.py --bin target/debug/cutforge-mcp
      - name: A4 时间线编辑全工具 e2e(四件套手势恰一 Op/split_all/gap_delete/paste/实渲对拍/锁定拒编辑)
        run: python tools/e2e_editing_tools.py --bin target/debug/cutforge-mcp
      - name: A4 字幕编辑器全流程 e2e(SRT 往返/批量替换/帧证文字位置/卡拉OK/花字)
        run: python tools/e2e_subtitle_editor.py --bin target/debug/cutforge-mcp
      - name: A5 关键帧壳侧闭环 e2e(秒表打点单 Op/投影采样对拍/曲线拖锚写回/菱形拖移)
        run: python tools/e2e_keyframes.py --bin target/debug/cutforge-mcp --cli target/debug/cutforge-cli
      - name: A5 调色壳侧闭环 e2e(色轮写回单 Op/帧色偏/LUT/示波器三画布/分屏割线)
        run: python tools/e2e_color.py --bin target/debug/cutforge-mcp --cli target/debug/cutforge-cli
      # A6(册六):独立性 e2e——ubuntu runner 无 CUTFLOW_REPO,恰是"无外部管线"的天然主场
      # (脚本再显式剥离 CUTFLOW_* 双保险);进程树断言零 python 子进程,psutil 缺席时
      # 走 /proc 兜底采样(Linux 主路径)。
      - name: A6 独立运行 e2e(AC-6.3:环境隔离 + 四大件内置 + 零 python 进程树断言 + 纯 CLI 面)
        run: python tools/e2e_independence.py --bin target/debug/cutforge-mcp --cli target/debug/cutforge-cli
      # A7(册七):AI 原生 e2e——脚本页签三内置片段/计划批准流(causedBy 对账+被拒项
      # 零落地,P0 文件级断言)/插件九步(三贡献点+越权双拦截+崩溃隔离)/标注线程+报告。
      # e2e_headless(watch 真实渲染+批处理,分钟级)不进 CI,本地册收官跑(gate A7)。
      - name: A7 AI 原生 e2e(AC-7.3/7.5:脚本三片段预演/批准流/插件九步/线程+报告)
        run: python tools/e2e_ai_native.py --bin target/debug/cutforge-mcp --cli target/debug/cutforge-cli
      # A2/A3/A4/A5 负载敏感 e2e 不进 CI:e2e_perf_timeline / e2e_drag_perf(帧率阈值 --min-fps 55)、
      # e2e_perf_budget(真实导出+媒体池 200 轮导航)、e2e_media_perf(千素材滚动帧率 +min-fps 55,
      # 共享 runner 抖动会假红)——本地册收官在安静时段跑(python tools/gates/gate.py A4)。

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # E1-1:cutforge-mcp(serve 所在二进制)纳入发布;没有它,预编译包起不了编辑器
      - run: cargo build --release --locked -p cutforge-render -p cutforge-cli -p cutforge-mcp
      - name: Package(每平台一个 zip = 三二进制 + web/,解压即用;E1-2)
        shell: bash
        run: |
          mkdir -p dist/web
          for bin in cutforge-render cutforge-cli cutforge-mcp; do
            src=target/release/$bin.exe
            [ -f "$src" ] || src=target/release/$bin
            cp "$src" dist/
          done
          cp apps/web/index.html apps/web/app.js apps/web/style.css dist/web/
          cd dist
          # 目录不能作为 Release 资产上传,必须打成单文件 zip;
          # 校验文件按平台命名,避免三平台资产同名互相覆盖
          pkgos=$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')
          if command -v zip >/dev/null 2>&1; then
            zip -r "cutforge-${pkgos}.zip" cutforge-render* cutforge-cli* cutforge-mcp* web
          else
            powershell -NoProfile -Command "Compress-Archive -Path cutforge-*,web -DestinationPath 'cutforge-${pkgos}.zip' -Force"
          fi
          sha256sum "cutforge-${pkgos}.zip" > "SHA256SUMS-${pkgos}.txt"
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: cutforge-${{ matrix.os }}
          path: dist/

  # 统一附加:三平台矩阵并发跑 "view 不存在则 create" 会撞车(v0.3.0 首跑实测,
  # 输掉竞态的一腿 exit 1 并被 fail-fast 连坐),附加动作只允许这一个 job 执行。
  # S-05(审查报告 v2 §6):cargo-deny 许可审计——观察模式。
  # 转阻断条件:首跑收集全部传递依赖许可证据 → 逐个裁决进 deny.toml →
  # 连续两轮无新增 unknown → 去掉 continue-on-error(纪律同 G-3/G-1)。
  license-gates:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check licenses
        run: cargo deny check licenses

  # G-3 尾巴(审查报告 v2 §8.1):A1 行数红线与 bench 阈值——观察模式。
  # 转阻断条件:①A-01/A-02/A-05 拆分波落地后 `gate.py A1 --check rust-line-limit`
  # 转绿(当前 crates 存量 11+ 文件 >800 行,拆分进行中);②bench 基线在共享
  # runner 双跑抖动 <5% 后挂回(见 CONTRIBUTING「门禁扫描面登记」)。
  legacy-gates:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Milestone gates A1 静态子集(行数/纯度/字形/散写 ms,观察模式;
          重活检查由 rust-gates/web-e2e/license-gates 各自 job 承担,此处不重复)
        run: |-
          python tools/gates/gate.py A1 --check rust-line-limit --json
          python tools/gates/gate.py A1 --check desktop-line-limit --json
          python tools/gates/gate.py A1 --check desktop-box-leak --json
          python tools/gates/gate.py A1 --check desktop-color-purity --json
          python tools/gates/gate.py A1 --check desktop-glyph-icon --json
          python tools/gates/gate.py A1 --check desktop-magic-ms --json

  release-upload:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    # 仓库默认 workflow 权限收紧为只读后,建 release/传资产必须显式申请
    # contents:write(v0.3.0 首跑 403 "Resource not accessible by integration" 实测)。
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-all
          pattern: cutforge-*
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist-all -type f | sort
          gh release view ${{ github.ref_name }} -R ${{ github.repository }} > /dev/null 2>&1 || gh release create ${{ github.ref_name }} -R ${{ github.repository }} --title "${{ github.ref_name }}" --generate-notes
          gh release upload ${{ github.ref_name }} dist-all/*/cutforge-*.zip dist-all/*/SHA256SUMS-*.txt --clobber -R ${{ github.repository }}
