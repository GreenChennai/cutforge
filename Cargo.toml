[workspace]
resolver = "3"
members = [
    "crates/cutforge-schema",
    "crates/cutforge-core",
    "crates/cutforge-io",
    "crates/cutforge-cli",
    "crates/cutforge-mcp",
    "crates/cutforge-script",
    "crates/cutforge-wasm",
    "crates/cutforge-render",
    "apps/desktop",
    # 后续加入:plugin-host / wasm(M5) / render(M6)
    # M5-4:apps/desktop 已落地(ADR-0039 恢复条件达成中,见 apps/desktop/README.md)
]

[workspace.package]
version = "0.5.0"
edition = "2024"
license-file = "LICENSE"      # ARL-1.0;MIT 归属走 NOTICE.md + LICENSE-OPENCUT.MIT

[profile.release]
lto = "thin"
strip = "debuginfo"
