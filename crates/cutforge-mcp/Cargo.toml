[package]
name = "cutforge-mcp"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "CutForge MCP 层(计划书 5.1/5.2):工具注册表与派发(契约见 schemas/mcp-tools.json,stdio 与内嵌 HTTP 共用同一分发表)+ 工作区编辑器服务(serve);编排类工具只封装 CutFlow 既有脚本,不重实现阶段逻辑"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cutforge-core = { path = "../cutforge-core" }
cutforge-io = { path = "../cutforge-io" }
cutforge-schema = { path = "../cutforge-schema" }
cutforge-script = { path = "../cutforge-script" }

[[bin]]
name = "cutforge-mcp"
path = "src/main.rs"
