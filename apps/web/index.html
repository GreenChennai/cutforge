<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CutForge 编辑器</title>
<!-- 册二模块化壳(T2.1,ADR-0011 无构建 ESM):静态托管根别名只保 index.html,
     全部子资源走 /assets/ 绝对路径(旧壳 legacy/ 已于册三收尾删除,回退期结束)。 -->
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<link rel="stylesheet" href="/assets/css/layout.css">
<link rel="stylesheet" href="/assets/css/components.css">
</head>
<body>
<!-- 顶部横幅区:token 变更提示(E6-2)/ 冲突停写(E8)/ 契约错误折叠(v0.6) -->
<div id="banner" hidden>
  <div id="token-banner" class="banner-row warn" hidden data-testid="banner-token"></div>
  <div id="conflict-banner" class="banner-row danger" hidden data-testid="banner-conflict"></div>
  <div id="internal-banner" class="banner-row warn" hidden data-testid="banner-internal"></div>
  <div id="conn-banner" class="banner-row danger" hidden data-testid="banner-conn"></div>
</div>
<header data-testid="topbar">
  <h1>CutForge</h1>
  <span class="sub" id="session-info" data-testid="session-info">连接中…</span>
  <span id="conn-badge" class="conn-badge" data-testid="conn-badge" data-state="init" title="事件通道连接态(SSE 长流 30min 寿命,断开自动重连/降级)">连接中…</span>
  <span class="spacer"></span>
  <button id="btn-project-new" data-testid="project-new" title="新建空工程(向导)">＋ 新建工程</button>
  <span class="tb-sep"></span>
  <button id="pv-to-start" data-testid="to-start" title="跳到开头(Home)">⏮</button>
  <button id="pv-play" data-testid="play-toggle" title="空格">▶ 播放</button>
  <button id="pv-to-end" data-testid="to-end" title="跳到结尾(End)">⏭</button>
  <span id="tb-time" data-testid="tb-time">0ms</span>
  <span class="tb-sep"></span>
  <label class="toggle"><input type="checkbox" id="magnet" checked data-testid="magnet"> 磁吸(帧网格)</label>
  <label class="toggle"><input type="checkbox" id="ripple" data-testid="ripple-toggle"> 波纹删除(Shift+Del)</label>
  <button id="btn-undo" data-testid="undo" title="Ctrl+Z">↩ 撤销</button>
  <button id="btn-redo" data-testid="redo" title="Ctrl+Y">↪ 重做</button>
</header>
<nav id="tabs" data-testid="tabs">
  <button data-tab="timeline" class="active" data-testid="tab-timeline">时间线</button>
  <button data-tab="transitions" data-testid="tab-transitions">转场库</button>
  <button data-tab="fx" data-testid="tab-fx">特效</button>
  <button data-tab="subtitles" data-testid="tab-subtitles">字幕</button>
  <button data-tab="history" data-testid="tab-history">历史</button>
  <button data-tab="notes" data-testid="tab-notes">标注</button>
  <button data-tab="diff" data-testid="tab-diff">差异面板</button>
  <button data-tab="conflicts" data-testid="tab-conflicts">冲突</button>
</nav>
<main>
  <!-- 面板内部结构由 js/panels/* 在装配期建入(T2.5);此处只留容器与 e2e 兼容锚点 -->
  <div id="tab-timeline" class="tab active">
    <div id="toolbar" data-testid="toolbar">
      <span id="sel-info" data-testid="sel-info">未选中片段:点击下方片段,或从左侧素材面板双击插入(S 分割 / Del 删除)</span>
      <span>播放头 <b id="playhead-ms" data-testid="playhead-ms">0</b>ms</span>
      <span>rev <b id="rev" data-testid="rev">-</b><span id="rev-dot" class="rev-dot" data-testid="rev-dot" title="投影已落盘(绿色脉冲 = 服务端已保存)" aria-hidden="true"></span></span>
    </div>
    <div id="workbench" data-testid="workbench">
      <div id="media-panel" class="panel" data-testid="media-panel"></div>
      <div id="pv-col">
        <div id="preview" data-testid="preview"></div>
        <div id="bgm-panel" class="panel" data-testid="bgm-panel"></div>
        <div id="export" class="panel" data-testid="export-panel"></div>
      </div>
      <div id="inspector" class="panel" data-testid="inspector"></div>
    </div>
    <div id="timeline-wrap" data-testid="timeline-wrap">
      <div id="ruler" data-testid="ruler"></div>
      <div id="tracks" data-testid="timeline-tracks"></div>
      <canvas id="tl-overlay" data-testid="tl-overlay"></canvas>
      <div id="playhead" data-testid="playhead"></div>
    </div>
  </div>
  <div id="tab-history" class="tab" data-testid="panel-history"></div>
  <div id="tab-transitions" class="tab" data-testid="panel-transitions"></div>
  <div id="tab-fx" class="tab" data-testid="panel-fx"></div>
  <div id="tab-subtitles" class="tab" data-testid="panel-subtitles"></div>
  <div id="tab-notes" class="tab" data-testid="panel-notes"></div>
  <div id="tab-diff" class="tab" data-testid="panel-diff"></div>
  <div id="tab-conflicts" class="tab" data-testid="panel-conflicts"></div>
</main>
<div id="wizard" class="wizard-mask" hidden data-testid="wizard"></div>
<footer>
  <div id="toasts" data-testid="toasts" aria-live="polite"></div>
  <span id="status" class="sr-only" data-testid="status" role="status"></span>
  <!-- 快捷键裁决锚点(T3.4):每次按键写 data-gate(屏蔽原因/命中组合),e2e 可断言 -->
  <span id="shortcut-gate" class="sr-only" data-testid="shortcut-gate" data-gate="boot" aria-hidden="true"></span>
</footer>
<script type="module" src="/assets/js/main.js"></script>
</body>
</html>
