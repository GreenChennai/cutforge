[package]
name = "cutforge-mcp"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "CutForge MCP 层(计划书 5.1/5.2):工具注册表与派发(契约见 schemas/mcp-tools.json,stdio 与内嵌 HTTP 共用同一分发表)+ 工作区编辑器服务(serve);编排类工具只封装 CutFlow 既有脚本,不重实现阶段逻辑"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cutforge-core = { path = "../cutforge-core" }
cutforge-io = { path = "../cutforge-io" }
cutforge-schema = { path = "../cutforge-schema" }
# 依赖边永久登记(A-01 注册表化轮收口,替代 V2-W1"归 A-01 解耦"的临时登记):
# 本边 = 纯函数元数据消费——analyze::{rms_envelope,onset_strength,frame_diffs,
# pcm_lag,pick_cuts}(波形/节拍/场景检测单一实现)、grade::parse_cube(LUT 解析)、
# encode::{HW_CANDIDATES,hw_encoder_usable}(硬编降级判定,与渲染端执行面同源)、
# subtitle::{parse_auto,ExportClip,srt_export_clips,ass_export}(SRT/ASS 解析导出
# 单一实现)、plan::RenderPlan/export::{window_project,source_advance_ms,
# clip_play_ms,preset_canvas}(导出矩阵时间窗纯计算)、RENDERER_VERSION(队列
# 事件版本位,渲染缓存同源版本戳);渲染本体一律经 resolve_render_bin 定位后
# 子进程 CLI 透传,不链其 Rust API。真解耦 = 上述纯函数迁 core/新契约 crate
# (跨 crate 大动作,动 render 本体,需主会话另立工单);消解前此边合法,
# cli check-deps 白名单已同步永久登记。
cutforge-render = { path = "../cutforge-render" }
cutforge-script = { path = "../cutforge-script" }

[[bin]]
name = "cutforge-mcp"
path = "src/main.rs"
