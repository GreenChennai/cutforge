[workspace]
resolver = "3"
members = [
    "crates/cutforge-schema",
    "crates/cutforge-core",
    "crates/cutforge-io",
    "crates/cutforge-cli",
    "crates/cutforge-mcp",
    "crates/cutforge-script",
    # 后续加入:plugin-host / wasm(M5) / render(M6)
    # M5 加入:apps/desktop(与上游 members 形状对齐)
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"      # ARL-1.0;MIT 归属走 NOTICE.md + LICENSE-OPENCUT.MIT

[profile.release]
lto = "thin"
strip = "debuginfo"
