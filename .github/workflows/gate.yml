name: gate
on: [push, pull_request]

jobs:
  python-gates:
    runs-on: windows-latest
    env:
      # 跨仓检查(repo-size / tests-layout)依赖 CutFlow 仓库
      CUTFLOW_REPO: ${{ github.workspace }}/../CutFlow
    steps:
      - uses: actions/checkout@v4
      - name: Clone CutFlow (shallow) for cross-repo checks
        run: git clone --depth 1 https://github.com/GreenChennai/CutFlow.git ../CutFlow
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Milestone gates
        run: python tools/gates/gate.py M0 --json
      - name: Python tests (cutflow-side bridge scripts live in CutFlow repo)
        if: hashFiles('tests/**/*.py') != ''
        run: |
          pip install pytest -q
          python -m pytest tests -q

  rust-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build & test (auto-enables when crates land)
        if: hashFiles('crates/*/Cargo.toml') != ''
        run: |
          cargo build --workspace --locked
          cargo test --workspace --locked
