[package]
name = "cutforge-desktop"
description = "CutForge 桌面壳(docs/upstream/03 C-FE):sable-dock 工作台 + /rpc 投影壳;真相在内核,壳零时间线语义"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[[bin]]
name = "cutforge-desktop"
path = "src/main.rs"

[dependencies]
# 桌面壳底座(sable v4.0+,full = dock+widgets+canvas+video)。
# git 依赖钉 rev(CI 可复现;升级窗口随 sable 发版推进 rev)。本地快速迭代可临时
# 切 path(sibling 检出 D:\Github\sable-ui),提交前必须还原 git 形态。
sable = { git = "https://github.com/GreenChennai/sable-ui.git", rev = "72d83c65ae149334c362d5e4bf9f0c84057781c2" }
# /rpc + 数据面 GET 客户端(blocking;调用一律在 gpui 后台线程)
ureq = { version = "2", features = ["json"] }
serde_json = "1"
# render_frame PNG → gpui RenderImage 裸帧(与 sable-canvas "png" 豁免同因)
image = "0.25"
# 播放引擎音频输出(I1 M1,docs/tickets/I1-S1):f32 立体声 48k → 默认设备;
# 默认 features(Windows 走 WASAPI),cpal 类型全部封在 playback/audio.rs 内
cpal = "0.18"
