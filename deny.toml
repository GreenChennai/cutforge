# cargo-deny 配置(S-05,审查报告 v2 §6):许可审计。
# 状态:观察模式(CI job continue-on-error)——首次全量许可清单未经人工核验,
# 预跑收集证据后:①把实际出现的非清单许可逐个裁决进 allow/clarify;
# ②裁满一轮无新增 → license-gates 转 blocking(与 G-1/G-3 升级口径同纪律)。
# 本仓自有 crate = ARL-1.0(非 OSI,见 LICENSE/README 声明),不在对第三方
# 依赖的许可要求内,deny 不扫描 workspace 自身。

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    "NCSA",
    "0BSD",
    "LicenseRef-ARL-1-0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

# 自有 9 crate:workspace 继承 license-file = LICENSE(ARL-1.0 闭源自用,ADR-0010);
# cargo-deny 不解析 workspace 继承 → 逐 crate clarify(hash 省略=跳过文件校验)
[[licenses.clarify]]
name = "cutforge-cli"
expression = "LicenseRef-ARL-1-0"
license-files = [{ path = "../../LICENSE", hash = 0x789e0e7f }]
[[licenses.clarify]]
name = "cutforge-core"
expression = "LicenseRef-ARL-1-0"
license-files = [{ path = "../../LICENSE", hash = 0x789e0e7f }]
