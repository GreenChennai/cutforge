[package]
name = "cutforge-wasm"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "CutForge wasm 绑定(计划书 2.4/7.6):Web 壳经字符串 ABI 使用内核纯投影;不含文件系统/时间线语义"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde_json = "1"
cutforge-core = { path = "../cutforge-core" }
cutforge-script = { path = "../cutforge-script" }

[dev-dependencies]
cutforge-io = { path = "../cutforge-io" }
cutforge-schema = { path = "../cutforge-schema" }

[package.metadata.wasm-pack.profile.release]
# binaryen 在受限网络不可用;体积已达标(gzip 后远小于 5MB),禁用可选优化保证确定性
wasm-opt = false
